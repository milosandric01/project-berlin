<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <g transform="rotate(180 8 8)">
  <!-- 8-bit flame — clean, recognizable teardrop shape -->
  <!-- Tip -->
  <rect x="7" y="0" width="2" height="1" fill="#fde68a"/>
  <!-- Upper narrow -->
  <rect x="6" y="1" width="4" height="1" fill="#fbbf24"/>
  <rect x="7" y="1" width="2" height="1" fill="#fef3c7"/>
  <!-- Widening -->
  <rect x="5" y="2" width="6" height="1" fill="#f59e0b"/>
  <rect x="6" y="2" width="4" height="1" fill="#fbbf24"/>
  <rect x="7" y="2" width="2" height="1" fill="#fde68a"/>
  <!-- Mid body -->
  <rect x="4" y="3" width="8" height="1" fill="#f97316"/>
  <rect x="5" y="3" width="6" height="1" fill="#f59e0b"/>
  <rect x="6" y="3" width="4" height="1" fill="#fbbf24"/>
  <rect x="7" y="3" width="2" height="1" fill="#fde68a"/>
  <!-- Widest -->
  <rect x="3" y="4" width="10" height="1" fill="#ea580c"/>
  <rect x="4" y="4" width="8" height="1" fill="#f97316"/>
  <rect x="6" y="4" width="4" height="1" fill="#fbbf24"/>
  <rect x="3" y="5" width="10" height="1" fill="#ea580c"/>
  <rect x="4" y="5" width="8" height="1" fill="#f97316"/>
  <rect x="6" y="5" width="4" height="1" fill="#f59e0b"/>
  <rect x="7" y="5" width="2" height="1" fill="#fbbf24"/>
  <!-- Lower body -->
  <rect x="3" y="6" width="10" height="1" fill="#dc2626"/>
  <rect x="4" y="6" width="8" height="1" fill="#ef4444"/>
  <rect x="6" y="6" width="4" height="1" fill="#f97316"/>
  <rect x="7" y="6" width="2" height="1" fill="#f59e0b"/>
  <rect x="3" y="7" width="10" height="1" fill="#dc2626"/>
  <rect x="4" y="7" width="8" height="1" fill="#ef4444"/>
  <rect x="6" y="7" width="4" height="1" fill="#ea580c"/>
  <rect x="7" y="7" width="2" height="1" fill="#f97316"/>
  <!-- Narrowing base -->
  <rect x="4" y="8" width="8" height="1" fill="#b91c1c"/>
  <rect x="5" y="8" width="6" height="1" fill="#dc2626"/>
  <rect x="7" y="8" width="2" height="1" fill="#ef4444"/>
  <rect x="4" y="9" width="8" height="1" fill="#991b1b"/>
  <rect x="5" y="9" width="6" height="1" fill="#b91c1c"/>
  <rect x="7" y="9" width="2" height="1" fill="#dc2626"/>
  <!-- Tapered bottom -->
  <rect x="5" y="10" width="6" height="1" fill="#7f1d1d"/>
  <rect x="6" y="10" width="4" height="1" fill="#991b1b"/>
  <rect x="7" y="10" width="2" height="1" fill="#b91c1c"/>
  <rect x="6" y="11" width="4" height="1" fill="#7f1d1d"/>
  <rect x="7" y="11" width="2" height="1" fill="#991b1b"/>
  <rect x="7" y="12" width="2" height="1" fill="#7f1d1d"/>
  </g>
</svg>
