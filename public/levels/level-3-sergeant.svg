  <rect x="4" y="2" width="8" height="1" fill="#9a3412"/>
  <rect x="3" y="3" width="1" height="1" fill="#9a3412"/>
  <rect x="12" y="3" width="1" height="1" fill="#9a3412"/>
  <rect x="3" y="4" width="1" height="1" fill="#9a3412"/>
  <rect x="12" y="4" width="1" height="1" fill="#9a3412"/>
  <rect x="3" y="5" width="1" height="1" fill="#9a3412"/>
  <rect x="12" y="5" width="1" height="1" fill="#9a3412"/>
  <rect x="3" y="6" width="1" height="1" fill="#9a3412"/>
  <rect x="12" y="6" width="1" height="1" fill="#9a3412"/>
  <rect x="3" y="7" width="1" height="1" fill="#9a3412"/>
  <rect x="12" y="7" width="1" height="1" fill="#9a3412"/>
  <rect x="4" y="8" width="1" height="1" fill="#9a3412"/>
  <rect x="11" y="8" width="1" height="1" fill="#9a3412"/>
  <rect x="4" y="9" width="1" height="1" fill="#9a3412"/>
  <rect x="11" y="9" width="1" height="1" fill="#9a3412"/>
  <rect x="5" y="10" width="1" height="1" fill="#9a3412"/>
  <rect x="10" y="10" width="1" height="1" fill="#9a3412"/>
  <rect x="6" y="11" width="1" height="1" fill="#9a3412"/>
  <rect x="9" y="11" width="1" height="1" fill="#9a3412"/>
  <rect x="7" y="12" width="2" height="1" fill="#9a3412"/>
  <!-- Shield fill -->
  <rect x="4" y="3" width="8" height="1" fill="#ea580c"/>
  <rect x="4" y="4" width="8" height="1" fill="#f97316"/>
  <rect x="4" y="5" width="8" height="1" fill="#f97316"/>
  <rect x="4" y="6" width="8" height="1" fill="#fb923c"/>
  <rect x="4" y="7" width="8" height="1" fill="#fb923c"/>
  <rect x="5" y="8" width="6" height="1" fill="#ea580c"/>
