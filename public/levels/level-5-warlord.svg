<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Warlord: tusked skull - purple/dark tones -->
  <!-- Skull top -->
  <rect x="5" y="1" width="6" height="1" fill="#6b21a8"/>
  <rect x="4" y="2" width="8" height="1" fill="#7c3aed"/>
  <rect x="3" y="3" width="10" height="1" fill="#8b5cf6"/>
  <rect x="3" y="4" width="10" height="1" fill="#8b5cf6"/>
  <rect x="3" y="5" width="10" height="1" fill="#a78bfa"/>
  <!-- Eye sockets -->
  <rect x="3" y="6" width="10" height="1" fill="#a78bfa"/>
  <rect x="4" y="6" width="2" height="1" fill="#1e1b4b"/>
  <rect x="10" y="6" width="2" height="1" fill="#1e1b4b"/>
  <rect x="3" y="7" width="10" height="1" fill="#8b5cf6"/>
  <rect x="4" y="7" width="2" height="1" fill="#1e1b4b"/>
  <rect x="10" y="7" width="2" height="1" fill="#1e1b4b"/>
  <!-- Red eye glow -->
  <rect x="5" y="6" width="1" height="1" fill="#ef4444"/>
  <rect x="10" y="6" width="1" height="1" fill="#ef4444"/>
  <!-- Nose -->
  <rect x="7" y="7" width="2" height="1" fill="#4c1d95"/>
  <rect x="7" y="8" width="2" height="1" fill="#4c1d95"/>
  <!-- Jaw -->
  <rect x="4" y="8" width="8" height="1" fill="#7c3aed"/>
  <rect x="4" y="9" width="8" height="1" fill="#6b21a8"/>
  <!-- Teeth -->
  <rect x="5" y="9" width="1" height="1" fill="#e5e7eb"/>
  <rect x="6" y="9" width="1" height="1" fill="#f3f4f6"/>
  <rect x="7" y="9" width="1" height="1" fill="#e5e7eb"/>
  <rect x="8" y="9" width="1" height="1" fill="#f3f4f6"/>
  <rect x="9" y="9" width="1" height="1" fill="#e5e7eb"/>
  <rect x="10" y="9" width="1" height="1" fill="#f3f4f6"/>
  <!-- Tusks -->
  <rect x="3" y="8" width="1" height="1" fill="#fef3c7"/>
  <rect x="2" y="7" width="1" height="1" fill="#fde68a"/>
  <rect x="2" y="6" width="1" height="1" fill="#fef3c7"/>
  <rect x="12" y="8" width="1" height="1" fill="#fef3c7"/>
  <rect x="13" y="7" width="1" height="1" fill="#fde68a"/>
  <rect x="13" y="6" width="1" height="1" fill="#fef3c7"/>
  <!-- Jaw bottom -->
  <rect x="5" y="10" width="6" height="1" fill="#4c1d95"/>
  <!-- Crown spikes on top -->
  <rect x="5" y="0" width="1" height="1" fill="#fbbf24"/>
  <rect x="7" y="0" width="2" height="1" fill="#fbbf24"/>
  <rect x="10" y="0" width="1" height="1" fill="#fbbf24"/>
</svg>
