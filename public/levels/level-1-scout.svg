<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Scout: hooded rogue with glowing green eyes and dagger -->
  <!-- Hood top -->
  <rect x="6" y="0" width="4" height="1" fill="#4b5563"/>
  <rect x="5" y="1" width="6" height="1" fill="#4b5563"/>
  <rect x="4" y="2" width="8" height="1" fill="#6b7280"/>
  <rect x="3" y="3" width="10" height="1" fill="#6b7280"/>
  <!-- Hood sides -->
  <rect x="3" y="4" width="2" height="1" fill="#6b7280"/>
  <rect x="11" y="4" width="2" height="1" fill="#6b7280"/>
  <rect x="3" y="5" width="2" height="1" fill="#4b5563"/>
  <rect x="11" y="5" width="2" height="1" fill="#4b5563"/>
  <rect x="3" y="6" width="1" height="1" fill="#4b5563"/>
  <rect x="12" y="6" width="1" height="1" fill="#4b5563"/>
  <!-- Face shadow -->
  <rect x="5" y="4" width="6" height="1" fill="#1f2937"/>
  <rect x="5" y="5" width="6" height="1" fill="#111827"/>
  <rect x="4" y="6" width="8" height="1" fill="#111827"/>
  <rect x="4" y="7" width="8" height="1" fill="#1f2937"/>
  <rect x="5" y="8" width="6" height="1" fill="#1f2937"/>
  <!-- Glowing eyes -->
  <rect x="5" y="5" width="2" height="1" fill="#34d399"/>
  <rect x="9" y="5" width="2" height="1" fill="#34d399"/>
  <rect x="6" y="6" width="1" height="1" fill="#6ee7b7"/>
  <rect x="9" y="6" width="1" height="1" fill="#6ee7b7"/>
  <!-- Mask -->
  <rect x="6" y="7" width="4" height="1" fill="#374151"/>
  <rect x="6" y="8" width="4" height="1" fill="#374151"/>
  <!-- Cloak body -->
  <rect x="4" y="8" width="1" height="1" fill="#4b5563"/>
  <rect x="11" y="8" width="1" height="1" fill="#4b5563"/>
  <rect x="3" y="9" width="10" height="1" fill="#4b5563"/>
  <rect x="3" y="10" width="10" height="1" fill="#374151"/>
  <rect x="3" y="11" width="10" height="1" fill="#374151"/>
  <rect x="4" y="12" width="8" height="1" fill="#1f2937"/>
  <rect x="4" y="13" width="8" height="1" fill="#1f2937"/>
  <rect x="5" y="14" width="6" height="1" fill="#111827"/>
  <rect x="6" y="15" width="4" height="1" fill="#111827"/>
  <!-- Dagger -->
  <rect x="12" y="7" width="1" height="1" fill="#f9fafb"/>
  <rect x="11" y="7" width="1" height="1" fill="#e5e7eb"/>
  <rect x="11" y="8" width="1" height="1" fill="#d1d5db"/>
  <rect x="10" y="9" width="1" height="1" fill="#9ca3af"/>
  <!-- Cloak clasp -->
  <rect x="7" y="9" width="2" height="1" fill="#9ca3af"/>
</svg>
