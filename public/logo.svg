<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Flowwix logo: 8-bit fire icon -->
  <!-- Flame tip -->
  <rect x="7" y="0" width="2" height="1" fill="#facc15"/>
  <rect x="6" y="1" width="4" height="1" fill="#facc15"/>
  <!-- Upper flame - yellow/orange -->
  <rect x="5" y="2" width="6" height="1" fill="#fb923c"/>
  <rect x="5" y="3" width="2" height="1" fill="#f97316"/>
  <rect x="7" y="3" width="2" height="1" fill="#facc15"/>
  <rect x="9" y="3" width="2" height="1" fill="#f97316"/>
  <!-- Mid flame - orange -->
  <rect x="4" y="4" width="8" height="1" fill="#f97316"/>
  <rect x="4" y="5" width="2" height="1" fill="#ea580c"/>
  <rect x="6" y="5" width="4" height="1" fill="#fb923c"/>
  <rect x="10" y="5" width="2" height="1" fill="#ea580c"/>
  <!-- Core flame - bright center -->
  <rect x="3" y="6" width="10" height="1" fill="#ea580c"/>
  <rect x="3" y="7" width="2" height="1" fill="#dc2626"/>
  <rect x="5" y="7" width="6" height="1" fill="#f97316"/>
  <rect x="11" y="7" width="2" height="1" fill="#dc2626"/>
  <!-- Inner glow -->
  <rect x="3" y="8" width="10" height="1" fill="#dc2626"/>
  <rect x="4" y="9" width="8" height="1" fill="#dc2626"/>
  <rect x="5" y="9" width="6" height="1" fill="#f97316"/>
  <!-- Hot core -->
  <rect x="6" y="7" width="4" height="1" fill="#fde047"/>
  <rect x="6" y="8" width="4" height="1" fill="#facc15"/>
  <rect x="7" y="9" width="2" height="1" fill="#facc15"/>
  <!-- Lower flame -->
  <rect x="4" y="10" width="8" height="1" fill="#b91c1c"/>
  <rect x="5" y="11" width="6" height="1" fill="#991b1b"/>
  <rect x="5" y="12" width="6" height="1" fill="#7f1d1d"/>
  <!-- Base embers -->
  <rect x="6" y="13" width="4" height="1" fill="#451a03"/>
  <rect x="7" y="14" width="2" height="1" fill="#292524"/>
</svg>
